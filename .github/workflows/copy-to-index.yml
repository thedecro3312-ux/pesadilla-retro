name: Copy to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy uploaded file to index.html
        run: |
          cp pesadilla-retro.html index.html
          rm pesadilla-retro.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pesadilla-retro.html
          git diff --cached --quiet || git commit -m "Update index.html"
          git push
